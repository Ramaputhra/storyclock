name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build
        id: build
        run: |
          npm install
          npm run build
          mkdir story-clock
          cp main.js manifest.json styles.css story-clock/
          zip -r story-clock.zip story-clock/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main.js,manifest.json,styles.css,story-clock.zip"
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }}"
          draft: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
